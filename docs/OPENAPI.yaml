components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identificador de la ruta (nombre real varía por endpoint, p. ej. installationId, gatewayId)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: API_DESIGN.md sección 6

  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Autenticado pero sin permiso (PERMISSIONS.md)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Error de validación de campos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    NotebookPerson:
      type: object
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string, format: uuid, nullable: true, description: Nulo = vale para todas las fincas }
        kind: { type: string, enum: [own_staff, service_company, adviser] }
        firstName: { type: string, nullable: true }
        surname1: { type: string, nullable: true }
        surname2: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        displayName: { type: string, description: La persona, o la empresa si no hay persona }
        nif: { type: string, nullable: true }
        ropoNumber: { type: string, nullable: true }
        ropoCardType: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        deleted: { type: boolean }

    NotebookPersonInput:
      type: object
      properties:
        installationId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [own_staff, service_company, adviser] }
        firstName: { type: string, maxLength: 120 }
        surname1: { type: string, maxLength: 120 }
        surname2: { type: string, maxLength: 120 }
        companyName: { type: string, maxLength: 200 }
        nif: { type: string, maxLength: 20 }
        ropoNumber: { type: string, maxLength: 60 }
        ropoCardType: { type: string, maxLength: 60 }
        notes: { type: string, maxLength: 500 }

    NotebookEquipment:
      type: object
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        displayName: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        romaNumber: { type: string, nullable: true }
        acquiredOn: { type: string, format: date, nullable: true }
        lastInspectionOn: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        deleted: { type: boolean }

    NotebookEquipmentInput:
      type: object
      properties:
        installationId: { type: string, format: uuid, nullable: true }
        description: { type: string, maxLength: 200 }
        brand: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 120 }
        romaNumber: { type: string, maxLength: 60 }
        acquiredOn: { type: string, format: date }
        lastInspectionOn: { type: string, format: date }
        notes: { type: string, maxLength: 500 }

    NotebookCompletenessItem:
      type: object
      properties:
        code: { type: string, example: phyto.registry_number, description: Código estable de la regla, con el identificador afectado como sufijo }
        kind: { type: string, enum: [missing, warning] }
        label: { type: string, example: El número de registro de Cobre 50 }
        why: { type: string, description: Por qué se pide, en español }
        source:
          type: string
          enum: [ue_2023_564, cue_unidad_de_cultivo, cue_tratamientos, cue_fertilizacion, cue_riego, cue_identificacion, rd_1051_2022, plataforma]
        sourceLabel: { type: string, description: La fuente escrita, para poder contrastarla }

    NotebookCompleteness:
      type: object
      properties:
        campaignId: { type: string, format: uuid }
        rules:
          type: object
          description: Conjunto de reglas con el que se revisó (ADR-0013)
          properties:
            id: { type: string, example: ES-2026.1 }
            country: { type: string, example: ES }
            region: { type: string, nullable: true }
            effectiveFrom: { type: string, format: date }
            effectiveTo: { type: string, format: date, nullable: true }
        managementMode: { type: string, enum: [simple, complete] }
        applicable: { type: boolean, description: false en una campaña sencilla }
        missingCount: { type: integer }
        warningCount: { type: integer }
        activitiesWithPending: { type: integer }
        reviewedActivities: { type: integer }
        campaign:
          type: array
          items: { $ref: "#/components/schemas/NotebookCompletenessItem" }
        activities:
          type: array
          items:
            type: object
            properties:
              activityId: { type: string, format: uuid }
              type: { type: string }
              startDate: { type: string, format: date }
              items:
                type: array
                items: { $ref: "#/components/schemas/NotebookCompletenessItem" }

    Error:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "validation-error" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    AuthSuccess:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken:
          type: object
          properties:
            sessionId: { type: string, format: uuid }
            secret: { type: string }

    AuthOrgSelection:
      type: object
      properties:
        preAuthToken: { type: string }
        organizations:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              name: { type: string }
              roleCode: { type: string }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    Me:
      type: object
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        isPlatformAdmin: { type: boolean }
        activeOrganizationId: { type: string, format: uuid, nullable: true }
        roleCode: { type: string, nullable: true }
        memberships:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              organizationName: { type: string }
              roleCode: { type: string }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        contactEmail: { type: string, format: email }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }

    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }
        contactEmail: { type: string, format: email }

    OrganizationFeature:
      type: object
      properties:
        featureCode: { type: string }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }

    Feature:
      type: object
      properties:
        code: { type: string }
        label: { type: string }

    OrgChannelThreshold:
      type: object
      properties:
        channelTypeCode: { type: string }
        defaultMin: { type: number, nullable: true }
        defaultMax: { type: number, nullable: true }
        updatedAt: { type: string, format: date-time }

    ChannelType:
      type: object
      properties:
        code: { type: string }
        unit: { type: string }
        dataType: { type: string, enum: [continuous, boolean, counter] }
        defaultAggregation: { type: string, enum: [average, sum, count_true] }
        minValid: { type: number, nullable: true }
        maxValid: { type: number, nullable: true }

    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        roleCode: { type: string, enum: [org_admin, technician, operator, read_only] }
        status: { type: string, enum: [invited, active, suspended] }
        invitedAt: { type: string, format: date-time, nullable: true }
        activatedAt: { type: string, format: date-time, nullable: true }

    MemberInvite:
      type: object
      required: [email, roleCode]
      properties:
        email: { type: string, format: email }
        roleCode: { type: string, enum: [org_admin, technician, operator, read_only] }

    Installation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        locationText: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        status: { type: string, enum: [active, inactive] }

    InstallationCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        locationText: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    SatelliteObservation:
      type: object
      description: >
        Una pasada del satelite sobre la parcela, ya procesada (BACKLOG.md #36).
        Una pasada que cae en dos tiles es UNA observacion.
      properties:
        observationId: { type: string, format: uuid }
        acquisitionTime:
          { type: string, format: date-time, description: "Momento de la pasada (UTC). Es la fecha de las graficas, nunca la de procesado." }
        provider: { type: string, example: copernicus }
        collection: { type: string, example: sentinel-2-l2a }
        platform: { type: string, nullable: true, example: sentinel-2b }
        processingVersion: { type: string, example: ndvi-s2-v1 }
        parcelGeometryVersion:
          { type: integer, description: "Contorno sobre el que se calculo: si la parcela se ha redibujado despues, este dato es de otro recinto." }
        status: { type: string, enum: [pending, processing, ready, rejected_quality, failed] }
        quality: { $ref: "#/components/schemas/SatelliteQuality" }
        metrics:
          type: object
          description: "Estadisticas por indice. En la v1 solo `ndvi`."
          additionalProperties: { $ref: "#/components/schemas/SatelliteMetric" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/SatelliteAsset" }

    SatelliteQuality:
      type: object
      properties:
        status: { type: string, enum: [good, partial, rejected], nullable: true }
        validPixelFraction:
          { type: number, format: double, nullable: true, description: "0..1. Superficie de la parcela con dato utilizable tras la mascara de nubes." }
        validPixelPercent:
          { type: integer, nullable: true, description: "Lo mismo en porcentaje entero, para ensenar sin falsa precision." }
        sceneCloudCover:
          { type: number, format: double, nullable: true, description: "Nubes de la ESCENA, informativo. No es la nubosidad sobre la parcela." }

    SatelliteMetric:
      type: object
      properties:
        mean: { type: number, format: double }
        median: { type: number, format: double }
        min: { type: number, format: double }
        max: { type: number, format: double }
        stdDev: { type: number, format: double }
        p10: { type: number, format: double }
        p90: { type: number, format: double }

    SatelliteAsset:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        assetType:
          { type: string, enum: [ndvi_raster, ndvi_preview], description: "`ndvi_raster`: GeoTIFF FLOAT32, el dato. `ndvi_preview`: PNG, solo para pintar." }
        mediaType: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        byteSize: { type: integer }

    SatellitePoint:
      type: object
      description: "Punto de la serie de NDVI. Mismos nombres que el historico de telemetria."
      properties:
        tsOrigin: { type: string, format: date-time }
        value: { type: number, format: double, description: "NDVI medio de los pixeles validos." }
        median: { type: number, format: double }
        observationId: { type: string, format: uuid }
        qualityStatus: { type: string, enum: [good, partial], nullable: true }
        validPixelFraction: { type: number, format: double, nullable: true }

    Parcel:
      type: object
      description: >
        Recinto de cultivo dibujado por el usuario (BACKLOG.md #36). La geometria
        se guarda en PostGIS y se expone siempre como GeoJSON en EPSG:4326
        (ADR-0009).
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string, nullable: true }
        geometry: { $ref: "#/components/schemas/GeoJsonMultiPolygon" }
        areaM2:
          { type: number, format: double, description: "Superficie en metros cuadrados, medida sobre el elipsoide." }
        bbox:
          type: array
          description: "Caja envolvente [minLon, minLat, maxLon, maxLat] en EPSG:4326."
          items: { type: number, format: double }
          minItems: 4
          maxItems: 4
        geometryVersion:
          { type: integer, description: "Sube cada vez que se redibuja el contorno." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ParcelCreate:
      type: object
      required: [name, geometry]
      properties:
        name: { type: string, maxLength: 120 }
        geometry:
          description: >
            Polygon o MultiPolygon GeoJSON en EPSG:4326. Un Polygon se normaliza
            a MultiPolygon al guardarlo, y el anillo se cierra solo si llega
            abierto.
          oneOf:
            - { $ref: "#/components/schemas/GeoJsonPolygon" }
            - { $ref: "#/components/schemas/GeoJsonMultiPolygon" }
        notes: { type: string, maxLength: 2000, nullable: true }

    ParcelUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        geometry:
          oneOf:
            - { $ref: "#/components/schemas/GeoJsonPolygon" }
            - { $ref: "#/components/schemas/GeoJsonMultiPolygon" }
        notes: { type: string, maxLength: 2000, nullable: true }

    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          description: "Anillos; el primero es el contorno exterior. Cada posicion es [lon, lat]."
          items:
            type: array
            items:
              type: array
              items: { type: number, format: double }
              minItems: 2
              maxItems: 2

    GeoJsonMultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [MultiPolygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items: { type: number, format: double }
                minItems: 2
                maxItems: 2

    Zone:
      type: object
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        name: { type: string }
        zoneType: { type: string, nullable: true }

    ZoneCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        zoneType: { type: string, nullable: true }

    Gateway:
      type: object
      properties:
        id: { type: string, format: uuid }
        installationId: { type: string, format: uuid }
        externalIdentifier: { type: string }
        name: { type: string }
        connectivityType: { type: string, enum: [lora_concentrator, direct_nbiot, direct_other] }
        status: { type: string, enum: [not_provisioned, online, offline, disabled] }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        heartbeatIntervalSeconds: { type: integer, nullable: true }

    GatewayCreate:
      type: object
      required: [installationId, name, connectivityType]
      properties:
        installationId: { type: string, format: uuid }
        name: { type: string }
        connectivityType: { type: string, enum: [lora_concentrator, direct_nbiot, direct_other] }

    GatewayCreated:
      allOf:
        - $ref: "#/components/schemas/Gateway"
        - type: object
          properties:
            credentialUsername: { type: string }
            credentialSecret:
              type: string
              description: Solo se devuelve en esta respuesta (API_DESIGN.md sección 7)

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        gatewayId: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        externalIdentifier: { type: string }
        name: { type: string }
        status: { type: string, enum: [not_provisioned, online, offline, disabled] }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    DeviceCreate:
      type: object
      required: [zoneId, externalIdentifier, name]
      properties:
        zoneId: { type: string, format: uuid }
        externalIdentifier: { type: string }
        name: { type: string }

    Sensor:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        externalIdentifier: { type: string }
        label: { type: string, nullable: true }

    SensorCreate:
      type: object
      required: [externalIdentifier]
      properties:
        externalIdentifier: { type: string, description: "Cualquiera salvo `_device`, reservado (ADR-0008)" }
        label: { type: string, nullable: true }

    Channel:
      type: object
      properties:
        id: { type: string, format: uuid }
        sensorId: { type: string, format: uuid }
        channelTypeCode: { type: string }
        alertThresholdMin: { type: number, nullable: true }
        alertThresholdMax: { type: number, nullable: true }

    LatestReading:
      type: object
      properties:
        channelId: { type: string, format: uuid }
        channelTypeCode: { type: string }
        value: { type: number }
        tsOrigin: { type: string, format: date-time }
        tsReceived: { type: string, format: date-time }
        sensorId: { type: string, format: uuid, description: "Solo en las rutas de una Estación (`/gateways/{gatewayId}/latest-readings` y su variante de plataforma): la pantalla agrupa los canales por sensor" }
        sensorExternalIdentifier: { type: string, description: "Solo en las rutas de una Estación. Identificador del sensor en el dispositivo (p. ej. la ranura A1-A4 de la WSC2-N)" }
        sensorLabel: { type: string, description: "Solo en las rutas de una Estación. Nombre del sensor, o su identificador externo si no tiene" }

    Reading:
      type: object
      properties:
        tsOrigin: { type: string, format: date-time }
        value: { type: number }
        min: { type: number, nullable: true, description: "Solo presente si granularity != raw y el canal es de tipo average" }
        max: { type: number, nullable: true }

    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        alertType:
          { type: string, enum: [threshold, offline, no_sensor_data], description: "`no_sensor_data`: la estación sigue enviando, pero ningún sensor de campo da datos desde hace más de una hora (BACKLOG.md #57)." }
        channelId: { type: string, format: uuid, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true }
        gatewayId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [open, acknowledged, resolved] }
        openedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
        installationId:
          { type: string, format: uuid, nullable: true, description: "Aditivo (Etapa 14): instalación a la que pertenece la causa de la alerta, cualquiera que sea (canal/dispositivo/gateway)." }
        installationName: { type: string, nullable: true }
        channelTypeCode: { type: string, nullable: true, description: "Solo presente si alertType=threshold." }
        deviceName: { type: string, nullable: true, description: "Solo presente si alertType=offline y la causa es un dispositivo." }
        gatewayName: { type: string, nullable: true, description: "Presente si la causa es un gateway: alertType=offline o alertType=no_sensor_data." }

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          description: >-
            Numérico (BigInt en Postgres) pero serializado como string, no
            number — JSON no representa enteros de 64 bits con precisión
            fuera del rango seguro de un double (~2^53); es lo mismo que
            hacen APIs como la de Twitter/GitHub con sus IDs int64.
        organizationId: { type: string, format: uuid, nullable: true }
        actorUserId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }

    PlatformOrganizationCreate:
      type: object
      required: [name, contactEmail, firstAdminEmail]
      properties:
        name: { type: string }
        contactEmail: { type: string, format: email }
        firstAdminEmail: { type: string, format: email }

    NotebookProfile:
      type: object
      description: >
        Respuestas del asistente del cuaderno completo (ADR-0013). Solo estas
        claves; al guardarse se añade `version`.
      properties:
        usesPlantProtectionProducts: { type: boolean }
        appliesFertilizers: { type: boolean }
        usesFertigation: { type: boolean }
        participatesInEcoSchemes: { type: boolean }
        usesValorizableWaste: { type: boolean }
        postHarvestTreatments: { type: boolean }
        storageTreatments: { type: boolean }
        transportTreatments: { type: boolean }
        treatedSeed: { type: boolean }

    CropUnitParcelInput:
      type: object
      required: [parcelId]
      properties:
        parcelId: { type: string, format: uuid }
        areaHa: { type: number, minimum: 0.0001, description: "Omitido = la parcela entera." }

    CropUnitCreate:
      type: object
      required: [parcels]
      description: El cultivo, del catálogo (`cropId`) o escrito (`cropName`); uno de los dos.
      properties:
        cropId: { type: string, pattern: "^[a-z0-9_]+$" }
        cropName: { type: string, maxLength: 120 }
        variety: { type: string, maxLength: 120 }
        previousCrop: { type: string, maxLength: 120 }
        waterRegime: { type: string, enum: [rainfed, irrigated] }
        growingEnvironment: { type: string, enum: [open_field, greenhouse, other] }
        productionSystem: { type: string, enum: [conventional, integrated, organic] }
        areaHa: { type: number, minimum: 0.0001 }
        expectedYieldKgHa: { type: number, minimum: 0 }
        notes: { type: string, maxLength: 4000 }
        parcels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CropUnitParcelInput" }

    CropUnitUpdate:
      allOf:
        - $ref: "#/components/schemas/CropUnitCreate"
      description: Todo opcional. `parcels`, si viene, sustituye a la lista entera.

    CampaignCreate:
      type: object
      required: [managementMode, startDate, cropUnits]
      properties:
        managementMode: { type: string, enum: [simple, complete] }
        name: { type: string, maxLength: 160, description: "Opcional: sin él, 'Aguacate Hass · 2026'." }
        startDate: { type: string, format: date }
        expectedEndDate: { type: string, format: date }
        notes: { type: string, maxLength: 4000 }
        cropUnits:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/CropUnitCreate" }
        notebookProfile: { $ref: "#/components/schemas/NotebookProfile" }

    CampaignUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        startDate: { type: string, format: date }
        expectedEndDate: { type: string, format: date, nullable: true }
        notes: { type: string, maxLength: 4000 }
        notebookProfile: { $ref: "#/components/schemas/NotebookProfile" }

    CampaignListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Aguacate Hass · 2026" }
        status: { type: string, enum: [draft, active, closed, archived] }
        managementMode: { type: string, enum: [simple, complete] }
        installation:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        startDate: { type: string, format: date }
        expectedEndDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        crops: { type: array, items: { type: string }, example: ["Aguacate Hass"] }
        parcelCount: { type: integer }
        areaHa: { type: number, description: "Hectáreas, con cuatro decimales." }
        lastActivity:
          type: object
          nullable: true
          properties:
            type: { type: string }
            date: { type: string, format: date }

    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignListItem"
        - type: object
          properties:
            notes: { type: string, nullable: true }
            notebookProfile: { type: object, additionalProperties: true }
            declaredProductionKg: { type: number, nullable: true }
            closingNotes: { type: string, nullable: true }
            closedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            cropUnits:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  cropId: { type: string, nullable: true }
                  cropName: { type: string }
                  variety: { type: string, nullable: true }
                  previousCrop: { type: string, nullable: true }
                  waterRegime: { type: string, nullable: true }
                  growingEnvironment: { type: string, nullable: true }
                  productionSystem: { type: string, nullable: true }
                  areaHa: { type: number, nullable: true, description: Declarada }
                  parcelsAreaHa: { type: number, description: Suma de sus parcelas }
                  effectiveAreaHa: { type: number, description: "La declarada o, si no, la de sus parcelas" }
                  expectedYieldKgHa: { type: number, nullable: true }
                  notes: { type: string, nullable: true }
                  parcels:
                    type: array
                    items:
                      type: object
                      properties:
                        parcelId: { type: string, format: uuid }
                        name: { type: string }
                        parcelAreaHa: { type: number }
                        areaHa: { type: number, nullable: true, description: "Declarada; nula = la parcela entera" }
                        effectiveAreaHa: { type: number }
                        deleted: { type: boolean, description: "La parcela se borró después; sigue por su historia" }

    ActivityTargetInput:
      type: object
      required: [parcelId]
      properties:
        parcelId: { type: string, format: uuid }
        cropUnitId: { type: string, format: uuid, description: "Solo si la parcela está en más de una unidad de la campaña." }
        areaHa: { type: number, minimum: 0.0001, description: "Omitido = todo lo que ocupa en la unidad." }

    IrrigationDetail:
      type: object
      properties:
        system: { type: string, enum: [surface, sprinkler_fixed, sprinkler_mobile, micro_sprinkler, fogging, drip, hydroponic_open, hydroponic_recirculating] }
        amount: { type: number, minimum: 0 }
        amountUnit: { type: string, enum: [m3, m3_ha, l] }
        volumeM3: { type: number, readOnly: true, description: "Calculado: m³ totales." }
        waterSource: { type: string }
        meterNumber: { type: string }
        nitrateMgL: { type: number }
        p2o5MgL: { type: number }

    FertilizationDetail:
      type: object
      properties:
        fertilizationType: { type: string, enum: [base, top_dressing, amendment, other] }
        materialType: { type: string, enum: [fertilizer_product, solid_manure, slurry, sewage_sludge, compost_digestate, other_waste, other] }
        productName: { type: string }
        dose: { type: number, minimum: 0 }
        doseUnit: { type: string, enum: [kg_ha, l_ha, t_ha, m3_ha, kg, l, t, m3] }
        applicationMethod: { type: string, enum: [broadcast, localized, fertigation, foliar, injection, other] }
        nPct: { type: number, minimum: 0, maximum: 100 }
        p2o5Pct: { type: number, minimum: 0, maximum: 100 }
        k2oPct: { type: number, minimum: 0, maximum: 100 }
        organicMatterPct: { type: number, minimum: 0, maximum: 100 }
        nKgHa: { type: number, readOnly: true, nullable: true, description: "Calculado; nulo si la dosis no va en peso." }
        p2o5KgHa: { type: number, readOnly: true, nullable: true }
        k2oKgHa: { type: number, readOnly: true, nullable: true }
        supplierName: { type: string }
        supplierNif: { type: string }
        supplierRega: { type: string }
        supplierNima: { type: string }
        applicatorCompany: { type: string }
        regferCode: { type: string }
        equipmentId: { type: string, format: uuid }

    PhytosanitaryDetail:
      type: object
      required: [products]
      properties:
        problem: { type: string }
        problemCategory: { type: string, enum: [weeds, diseases, arthropods, growth_regulators, other] }
        justification: { type: string }
        bbchCode: { type: string, pattern: "^[0-9]{2}$" }
        phenologicalStageLabel: { type: string }
        applicatorId: { type: string, format: uuid }
        adviserId: { type: string, format: uuid }
        equipmentId: { type: string, format: uuid }
        manualApplication: { type: boolean }
        efficacy: { type: string, enum: [good, fair, poor] }
        products:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [productName]
            properties:
              productName: { type: string }
              registryNumber: { type: string }
              activeSubstances: { type: string }
              dose: { type: number }
              doseUnit: { type: string, enum: [l_ha, kg_ha, l_hl, kg_hl] }
              totalQuantity: { type: number }
              totalQuantityUnit: { type: string, enum: [l, kg] }

    HarvestDetail:
      type: object
      properties:
        product: { type: string }
        quantity: { type: number, minimum: 0 }
        quantityUnit: { type: string, enum: [kg, t, units] }
        quantityKg: { type: number, readOnly: true, nullable: true }
        lotCode: { type: string }
        deliveryNote: { type: string }
        customerName: { type: string }
        customerNif: { type: string }
        customerAddress: { type: string }
        customerRgseaa: { type: string }
        destination: { type: string }
        qualityGrade: { type: string }

    FieldWorkDetail:
      type: object
      required: [workType]
      properties:
        workType: { type: string, enum: [soil_preparation, tillage, pruning, clearing, mowing, shredding, thinning, grafting, cover_management, mechanical_control, maintenance, other] }
        pruningResiduesLeft: { type: boolean }
        clearingResiduesLeft: { type: boolean }
        hours: { type: number }
        machinery: { type: string }

    CampaignActivityCreate:
      type: object
      required: [type, startDate, targets]
      properties:
        type: { type: string, enum: [irrigation, fertilization, phytosanitary, field_work, harvest, observation, sowing, other] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: "Omitido = el mismo día." }
        startTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        notes: { type: string, maxLength: 4000 }
        repeatedFromId: { type: string, format: uuid, description: '"Repetir": de qué actividad se copió.' }
        targets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ActivityTargetInput" }
        irrigation: { $ref: "#/components/schemas/IrrigationDetail" }
        fertilization: { $ref: "#/components/schemas/FertilizationDetail" }
        phytosanitary: { $ref: "#/components/schemas/PhytosanitaryDetail" }
        harvest: { $ref: "#/components/schemas/HarvestDetail" }
        fieldWork: { $ref: "#/components/schemas/FieldWorkDetail" }

    CampaignActivityUpdate:
      type: object
      description: Como el alta, todo opcional y sin `type`.
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startTime: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        targets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ActivityTargetInput" }
        irrigation: { $ref: "#/components/schemas/IrrigationDetail" }
        fertilization: { $ref: "#/components/schemas/FertilizationDetail" }
        phytosanitary: { $ref: "#/components/schemas/PhytosanitaryDetail" }
        harvest: { $ref: "#/components/schemas/HarvestDetail" }
        fieldWork: { $ref: "#/components/schemas/FieldWorkDetail" }

    CampaignActivity:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        type: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startTime: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        origin: { type: string, enum: [manual, repeated, sensor_suggestion] }
        repeatedFromId: { type: string, format: uuid, nullable: true }
        areaHa: { type: number }
        targets:
          type: array
          items:
            type: object
            properties:
              parcelId: { type: string, format: uuid }
              parcelName: { type: string }
              cropUnitId: { type: string, format: uuid }
              cropName: { type: string, example: "Aguacate Hass" }
              areaHa: { type: number, nullable: true }
              effectiveAreaHa: { type: number }
        irrigation: { allOf: [{ $ref: "#/components/schemas/IrrigationDetail" }], nullable: true }
        fertilization: { allOf: [{ $ref: "#/components/schemas/FertilizationDetail" }], nullable: true }
        phytosanitary:
          nullable: true
          description: "Con applicatorSnapshot, adviserSnapshot y equipmentSnapshot: copia de la ficha del catálogo tal como era al registrar."
          allOf: [{ $ref: "#/components/schemas/PhytosanitaryDetail" }]
        harvest: { allOf: [{ $ref: "#/components/schemas/HarvestDetail" }], nullable: true }
        fieldWork: { allOf: [{ $ref: "#/components/schemas/FieldWorkDetail" }], nullable: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CampaignSummary:
      type: object
      properties:
        campaignId: { type: string, format: uuid }
        areaHa: { type: number }
        activityCount: { type: integer }
        lastActivity:
          type: object
          nullable: true
          properties:
            type: { type: string }
            date: { type: string, format: date }
        irrigation:
          type: object
          nullable: true
          properties:
            count: { type: integer }
            volumeM3: { type: number }
            volumeM3PerHa: { type: number, nullable: true }
            withoutVolume: { type: integer }
        fertilization:
          type: object
          nullable: true
          properties:
            count: { type: integer }
            nKg: { type: number }
            p2o5Kg: { type: number }
            k2oKg: { type: number }
            nKgHa: { type: number, nullable: true }
            p2o5KgHa: { type: number, nullable: true }
            k2oKgHa: { type: number, nullable: true }
            withoutComposition: { type: integer }
        phytosanitary:
          type: object
          nullable: true
          properties:
            count: { type: integer }
            distinctProducts: { type: integer }
        harvest:
          type: object
          nullable: true
          properties:
            count: { type: integer }
            quantityKg: { type: number }
            yieldKgHa: { type: number, nullable: true }
            expectedYieldKgHa: { type: number, nullable: true }
            withoutKg: { type: integer }
        fieldWork: { type: object, nullable: true, properties: { count: { type: integer } } }
        observations: { type: object, nullable: true, properties: { count: { type: integer } } }
        cropUnits:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              cropName: { type: string }
              areaHa: { type: number }
              harvestKg: { type: number, nullable: true }
              yieldKgHa: { type: number, nullable: true }
              expectedYieldKgHa: { type: number, nullable: true }
