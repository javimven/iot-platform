        (ADR-0007, `platform.telemetry.read`). Mismos parámetros y límites que
        `/channels/{channelId}/readings`.
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/PathId" }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          schema: { type: string, enum: [raw, hourly, daily], default: raw }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reading" }
        "400":
