openapi: 3.0.3
info:
  title: IoT Monitoring Platform API
  version: "1.0.0-draft"
  description: >
    Contrato de referencia de la Etapa 7 (API_DESIGN.md). Cubre el alcance del MVP
    (Etapa 1/PRODUCT_REQUIREMENTS.md sección 9.1). No incluye comandos remotos,
    firmware, API keys ni informes (V2/Futuro). Los recursos de Directorio IoT bajo
    /platform se muestran solo con `gateways` como representativo; el resto de
    recursos (installations, zones, devices, sensors, channels) se mecaniza igual
    (ver API_DESIGN.md sección 2).
servers:
  - url: https://api.example.com/v1
    description: Producción (dominio real a definir en Etapa 9)
  - url: https://staging-api.example.com/v1
    description: Staging

tags:
  - name: auth
  - name: me
  - name: organization
  - name: members
  - name: installations
  - name: zones
  - name: parcels
  - name: satellite
  - name: gateways
  - name: devices
  - name: sensors
  - name: channels
  - name: readings
  - name: alerts
  - name: audit
  - name: platform

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: >
            Éxito. Si el usuario tiene una única organización activa (o ninguna,
            Admin de plataforma), devuelve AuthSuccess. Si tiene varias, devuelve
            AuthOrgSelection (ver API_DESIGN.md sección 3).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthSuccess"
                  - $ref: "#/components/schemas/AuthOrgSelection"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/select-organization:
    post:
      tags: [auth]
      summary: Completar el login eligiendo la organización activa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preAuthToken, organizationId]
              properties:
                preAuthToken: { type: string }
                organizationId: { type: string, format: uuid }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSuccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar el access token (refresh token rotativo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, secret]
              properties:
                sessionId: { type: string, format: uuid }
                secret: { type: string }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSuccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revocar la sesión actual
      responses:
        "204": { description: Sin contenido }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Solicitar recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Aceptado (siempre, exista o no el email — no filtra existencia de cuentas)

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Confirmar recuperación de contraseña con token de un solo uso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        "200": { description: Contraseña actualizada }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/sessions:
    get:
      tags: [auth]
      summary: Listar mis sesiones activas
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: >
        Revocar una sesión propia — nunca de otro miembro, idempotente
        (204 aunque no exista o sea de otro usuario, PERMISSIONS.md sección
        9/13). Para revocar la sesión de otro miembro con sessions.revoke_others,
        ver /members/{id}/sessions/{sessionId}.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Sin contenido }

  /me:
    get:
      tags: [me]
      summary: Perfil propio, rol y organización activa
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /me/permissions:
    get:
      tags: [me]
      summary: Acciones permitidas para el rol activo (PERMISSIONS.md sección 5)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { type: string }
                    example: ["installations.read", "alerts.acknowledge"]

  /organization:
    get:
      tags: [organization]
      summary: Perfil de la organización activa
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    patch:
      tags: [organization]
      summary: Actualizar nombre/email de contacto (org.profile.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organization/features:
    get:
      tags: [organization]
      summary: Feature flags activos para mi organización (org_features.read)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationFeature" }

  /organization/channel-thresholds:
    get:
      tags: [organization]
      summary: >
        Umbrales por defecto ya configurados para mi organización
        (channels.read) — antes solo existía el PUT por tipo de canal, sin
        ninguna forma de leer el valor actual (BACKLOG.md #16).
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrgChannelThreshold" }

  /organization/channel-thresholds/{channelTypeCode}:
    put:
      tags: [organization]
      summary: Definir el umbral por defecto de un tipo de canal para mi organización
      parameters:
        - name: channelTypeCode
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultMin: { type: number, nullable: true }
                defaultMax: { type: number, nullable: true }
      responses:
        "200": { description: Éxito }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channel-types:
    get:
      tags: [organization]
      summary: Catálogo de tipos de canal disponibles en la plataforma
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelType" }

  /members:
    get:
      tags: [members]
      summary: Listar miembros de mi organización (members.read)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      tags: [members]
      summary: Invitar un miembro (members.invite)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvite" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/{memberId}:
    patch:
      tags: [members]
      summary: Cambiar rol o estado de un miembro
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleCode: { type: string, enum: [org_admin, technician, operator, read_only] }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [members]
      summary: Dar de baja a un miembro (baja lógica)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Sin contenido }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/{memberId}/scope:
    get:
      tags: [members]
      summary: Alcance de instalaciones asignado a un miembro
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: "Éxito. Array vacío = sin restricción (todas las instalaciones), PERMISSIONS.md sección 2"
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
    put:
      tags: [members]
      summary: Reemplazar el conjunto de instalaciones asignadas a un miembro
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string, format: uuid }
      responses:
        "200": { description: Éxito }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/{memberId}/sessions:
    get:
      tags: [members]
      summary: >
        Sesiones activas de otro miembro (sessions.read_others, PERMISSIONS.md
        sección 1) — solo Admin de organización, `BACKLOG.md` #14.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /members/{memberId}/sessions/{sessionId}:
    delete:
      tags: [members]
      summary: >
        Revocar la sesión de otro miembro (sessions.revoke_others) — p. ej.
        un empleado que deja la empresa o cuya cuenta se ve comprometida.
        Idempotente (204 aunque la sesión ya no exista).
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Sin contenido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /installations:
    get:
      tags: [installations]
      summary: Listar instalaciones (con alcance aplicado, PERMISSIONS.md sección 2)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Installation" }
    post:
      tags: [installations]
      summary: Crear instalación
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }

  /installations/{installationId}:
    get:
      tags: [installations]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [installations]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationCreate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
    delete:
      tags: [installations]
      summary: Baja lógica
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /installations/{installationId}/zones:
    get:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
    post:
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }

  /installations/{installationId}/parcels:
    get:
      tags: [parcels]
      summary: Parcelas de una finca, con su contorno en GeoJSON
      description: >
        Requiere la funcion `satellite_imagery` contratada por la organizacion
        (FeatureGuard): sin ella responde 403 aunque el rol tenga el permiso.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Parcel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [parcels]
      summary: Crea una parcela dibujada sobre el mapa
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParcelCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parcel" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ya hay una parcela con ese nombre en la finca

  /parcels/{parcelId}:
    get:
      tags: [parcels]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parcel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [parcels]
      summary: Renombra la parcela o redibuja su contorno
      description: >
        Enviar `geometry` sustituye el contorno y sube `geometryVersion`, que
        es lo que marca como caduco lo calculado por satelite sobre el contorno
        anterior.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParcelUpdate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parcel" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ya hay una parcela con ese nombre en la finca
    delete:
      tags: [parcels]
      summary: Borrado logico; las estaciones asignadas se quedan sin parcela
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parcels/{parcelId}/satellite/latest:
    get:
      tags: [satellite]
      summary: Ultima observacion utilizable de la parcela
      description: >
        Devuelve `null` si la parcela todavia no tiene ninguna observacion
        lista: acaba de crearse, o las pasadas disponibles estaban demasiado
        tapadas. Requiere la funcion `satellite_imagery` contratada.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SatelliteObservation" }
                  - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parcels/{parcelId}/satellite/observations:
    get:
      tags: [satellite]
      summary: Historico de observaciones, de la mas reciente a la mas antigua
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - name: includeRejected
          in: query
          required: false
          schema: { type: boolean }
          description: >
            Incluye las descartadas por calidad. Sirven para explicar por que la
            serie tiene un hueco ese dia.
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatelliteObservation" }

  /parcels/{parcelId}/satellite/timeseries:
    get:
      tags: [satellite]
      summary: Serie temporal de NDVI para la grafica
      description: >
        Solo observaciones utilizables y en orden ascendente. Usa `tsOrigin` y
        `value` como el historico de un canal de telemetria, para que el cliente
        reutilice sus graficas; la calidad viene al lado porque en satelite no es
        un detalle.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatellitePoint" }

  /parcels/{parcelId}/satellite/observations/{observationId}:
    get:
      tags: [satellite]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatelliteObservation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parcels/{parcelId}/satellite/observations/{observationId}/assets:
    get:
      tags: [satellite]
      summary: Archivos de la observacion (sin URL; esa se pide aparte)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatelliteAsset" }

  /parcels/{parcelId}/satellite/observations/{observationId}/assets/{assetId}/url:
    get:
      tags: [satellite]
      summary: Enlace temporal de descarga del archivo
      description: >
        El bucket es privado y sus credenciales no salen del backend: lo que se
        entrega es una URL firmada que caduca (15 minutos).
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetId: { type: string, format: uuid }
                  assetType: { type: string, enum: [ndvi_raster, ndvi_preview] }
                  mediaType: { type: string }
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /parcels/{parcelId}/satellite/refresh:
    post:
      tags: [satellite]
      summary: Fuerza una busqueda de pasadas nuevas (satellite.refresh)
      description: >
        Encola un repaso corto de esa parcela. Gasta cuota de Copernicus, asi
        que solo se admite **uno por parcela y hora**.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "201":
          description: Encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [encolado] }
                  dias: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Ya se refresco esta parcela hace menos de una hora

  /installations/{installationId}/latest-readings:
    get:
      tags: [readings]
      summary: Últimas lecturas de todos los canales de una instalación (dashboard)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LatestReading" }

  /zones/{zoneId}:
    get:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    patch:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneCreate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    delete:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /gateways:
    get:
      tags: [gateways]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gateway" }
    post:
      tags: [gateways]
      summary: Pre-registrar un gateway (concentrador LoRa o estación directa, ADR-0004)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayCreate" }
      responses:
        "201":
          description: >
            Creado. El campo `credentialSecret` solo aparece en esta respuesta
            (API_DESIGN.md sección 7) — no se puede recuperar después.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayCreated" }

  /gateways/{gatewayId}:
    get:
      tags: [gateways]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gateway" }
    patch:
      tags: [gateways]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
