openapi: 3.0.3
info:
  title: IoT Monitoring Platform API
  version: "1.0.0-draft"
  description: >
    Contrato de referencia de la Etapa 7 (API_DESIGN.md). Cubre el alcance del MVP
    (Etapa 1/PRODUCT_REQUIREMENTS.md sección 9.1). No incluye comandos remotos,
    firmware, API keys ni informes (V2/Futuro). Los recursos de Directorio IoT bajo
    /platform se muestran solo con `gateways` como representativo; el resto de
    recursos (installations, zones, devices, sensors, channels) se mecaniza igual
    (ver API_DESIGN.md sección 2).
servers:
  - url: https://api.example.com/v1
    description: Producción (dominio real a definir en Etapa 9)
  - url: https://staging-api.example.com/v1
    description: Staging

tags:
  - name: auth
  - name: me
  - name: organization
  - name: members
  - name: installations
  - name: zones
  - name: parcels
  - name: satellite
  - name: campaigns
  - name: gateways
  - name: devices
  - name: sensors
  - name: channels
  - name: readings
  - name: alerts
  - name: audit
  - name: platform

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: >
            Éxito. Si el usuario tiene una única organización activa (o ninguna,
            Admin de plataforma), devuelve AuthSuccess. Si tiene varias, devuelve
            AuthOrgSelection (ver API_DESIGN.md sección 3).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthSuccess"
                  - $ref: "#/components/schemas/AuthOrgSelection"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/select-organization:
    post:
      tags: [auth]
      summary: Completar el login eligiendo la organización activa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preAuthToken, organizationId]
              properties:
                preAuthToken: { type: string }
                organizationId: { type: string, format: uuid }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSuccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar el access token (refresh token rotativo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, secret]
              properties:
                sessionId: { type: string, format: uuid }
                secret: { type: string }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSuccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revocar la sesión actual
      responses:
        "204": { description: Sin contenido }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Solicitar recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Aceptado (siempre, exista o no el email — no filtra existencia de cuentas)

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Confirmar recuperación de contraseña con token de un solo uso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password }
      responses:
        "200": { description: Contraseña actualizada }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/sessions:
    get:
      tags: [auth]
      summary: Listar mis sesiones activas
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: >
        Revocar una sesión propia — nunca de otro miembro, idempotente
        (204 aunque no exista o sea de otro usuario, PERMISSIONS.md sección
        9/13). Para revocar la sesión de otro miembro con sessions.revoke_others,
        ver /members/{id}/sessions/{sessionId}.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Sin contenido }

  /me:
    get:
      tags: [me]
      summary: Perfil propio, rol y organización activa
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /me/permissions:
    get:
      tags: [me]
      summary: Acciones permitidas para el rol activo (PERMISSIONS.md sección 5)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { type: string }
                    example: ["installations.read", "alerts.acknowledge"]

  /organization:
    get:
      tags: [organization]
      summary: Perfil de la organización activa
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
    patch:
      tags: [organization]
      summary: Actualizar nombre/email de contacto (org.profile.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organization/features:
    get:
      tags: [organization]
      summary: Feature flags activos para mi organización (org_features.read)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationFeature" }

  /organization/channel-thresholds:
    get:
      tags: [organization]
      summary: >
        Umbrales por defecto ya configurados para mi organización
        (channels.read) — antes solo existía el PUT por tipo de canal, sin
        ninguna forma de leer el valor actual (BACKLOG.md #16).
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrgChannelThreshold" }

  /organization/channel-thresholds/{channelTypeCode}:
    put:
      tags: [organization]
      summary: Definir el umbral por defecto de un tipo de canal para mi organización
      parameters:
        - name: channelTypeCode
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultMin: { type: number, nullable: true }
                defaultMax: { type: number, nullable: true }
      responses:
        "200": { description: Éxito }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channel-types:
    get:
      tags: [organization]
      summary: Catálogo de tipos de canal disponibles en la plataforma
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelType" }

  /members:
    get:
      tags: [members]
      summary: Listar miembros de mi organización (members.read)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      tags: [members]
      summary: Invitar un miembro (members.invite)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvite" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/{memberId}:
    patch:
      tags: [members]
      summary: Cambiar rol o estado de un miembro
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleCode: { type: string, enum: [org_admin, technician, operator, read_only] }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [members]
      summary: Dar de baja a un miembro (baja lógica)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Sin contenido }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/{memberId}/scope:
    get:
      tags: [members]
      summary: Alcance de instalaciones asignado a un miembro
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: "Éxito. Array vacío = sin restricción (todas las instalaciones), PERMISSIONS.md sección 2"
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
    put:
      tags: [members]
      summary: Reemplazar el conjunto de instalaciones asignadas a un miembro
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string, format: uuid }
      responses:
        "200": { description: Éxito }
        "403": { $ref: "#/components/responses/Forbidden" }

  /members/{memberId}/sessions:
    get:
      tags: [members]
      summary: >
        Sesiones activas de otro miembro (sessions.read_others, PERMISSIONS.md
        sección 1) — solo Admin de organización, `BACKLOG.md` #14.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /members/{memberId}/sessions/{sessionId}:
    delete:
      tags: [members]
      summary: >
        Revocar la sesión de otro miembro (sessions.revoke_others) — p. ej.
        un empleado que deja la empresa o cuya cuenta se ve comprometida.
        Idempotente (204 aunque la sesión ya no exista).
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/PathId"
      responses:
        "204": { description: Sin contenido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /installations:
    get:
      tags: [installations]
      summary: Listar instalaciones (con alcance aplicado, PERMISSIONS.md sección 2)
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Installation" }
    post:
      tags: [installations]
      summary: Crear instalación
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }

  /installations/{installationId}:
    get:
      tags: [installations]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [installations]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationCreate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
    delete:
      tags: [installations]
      summary: Baja lógica
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /installations/{installationId}/zones:
    get:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
    post:
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }

  /installations/{installationId}/parcels:
    get:
      tags: [parcels]
      summary: Parcelas de una finca, con su contorno en GeoJSON
      description: >
        Requiere la funcion `satellite_imagery` o `campaigns` contratada por la
        organizacion (FeatureGuard): sin ninguna, 403 aunque el rol tenga el permiso.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Parcel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [parcels]
      summary: Crea una parcela dibujada sobre el mapa
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParcelCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parcel" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ya hay una parcela con ese nombre en la finca

  /parcels/{parcelId}:
    get:
      tags: [parcels]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parcel" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [parcels]
      summary: Renombra la parcela o redibuja su contorno
      description: >
        Enviar `geometry` sustituye el contorno y sube `geometryVersion`, que
        es lo que marca como caduco lo calculado por satelite sobre el contorno
        anterior.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParcelUpdate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parcel" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Ya hay una parcela con ese nombre en la finca
    delete:
      tags: [parcels]
      summary: Borrado logico; las estaciones asignadas se quedan sin parcela
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }
        "403": { $ref: "#/components/responses/Forbidden" }

  /parcels/{parcelId}/satellite/latest:
    get:
      tags: [satellite]
      summary: Ultima observacion utilizable de la parcela
      description: >
        Devuelve `null` si la parcela todavia no tiene ninguna observacion
        lista: acaba de crearse, o las pasadas disponibles estaban demasiado
        tapadas. Requiere la funcion `satellite_imagery` contratada.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SatelliteObservation" }
                  - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parcels/{parcelId}/satellite/observations:
    get:
      tags: [satellite]
      summary: Historico de observaciones, de la mas reciente a la mas antigua
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - name: includeRejected
          in: query
          required: false
          schema: { type: boolean }
          description: >
            Incluye las descartadas por calidad. Sirven para explicar por que la
            serie tiene un hueco ese dia.
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatelliteObservation" }

  /parcels/{parcelId}/satellite/timeseries:
    get:
      tags: [satellite]
      summary: Serie temporal de NDVI para la grafica
      description: >
        Solo observaciones utilizables y en orden ascendente. Usa `tsOrigin` y
        `value` como el historico de un canal de telemetria, para que el cliente
        reutilice sus graficas; la calidad viene al lado porque en satelite no es
        un detalle.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatellitePoint" }

  /parcels/{parcelId}/satellite/observations/{observationId}:
    get:
      tags: [satellite]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatelliteObservation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /parcels/{parcelId}/satellite/observations/{observationId}/assets:
    get:
      tags: [satellite]
      summary: Archivos de la observacion (sin URL; esa se pide aparte)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatelliteAsset" }

  /parcels/{parcelId}/satellite/observations/{observationId}/assets/{assetId}/url:
    get:
      tags: [satellite]
      summary: Enlace temporal de descarga del archivo
      description: >
        El bucket es privado y sus credenciales no salen del backend: lo que se
        entrega es una URL firmada que caduca (15 minutos).
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetId: { type: string, format: uuid }
                  assetType: { type: string, enum: [ndvi_raster, ndvi_preview] }
                  mediaType: { type: string }
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /parcels/{parcelId}/satellite/refresh:
    post:
      tags: [satellite]
      summary: Fuerza una busqueda de pasadas nuevas (satellite.refresh)
      description: >
        Encola un repaso corto (15 dias) de esa parcela, o el historico
        completo (`SATELLITE_BACKFILL_DAYS`, 90 por defecto) si todavia no
        tiene ninguna observacion; `dias` dice cual. Gasta cuota de
        Copernicus, asi que solo se admite **uno por parcela y hora**.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "201":
          description: Encolado
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [encolado] }
                  dias: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Ya se refresco esta parcela hace menos de una hora

  /campaigns:
    get:
      tags: [campaigns]
      summary: Campañas de la organización, dentro del alcance del miembro (campaigns.read)
      description: >
        Requiere la función `campaigns`. Cruza fincas y respeta el alcance por
        finca. Ordenadas por fecha de inicio, las más recientes primero.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, active, closed, archived] } }
        - { name: installationId, in: query, schema: { type: string, format: uuid } }
        - name: year
          in: query
          description: Campañas que tocan ese año (empiezan antes de que acabe y no se cerraron antes de que empiece).
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - { name: cropId, in: query, schema: { type: string, pattern: "^[a-z0-9_]+$" } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignListItem" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /installations/{installationId}/campaigns:
    post:
      tags: [campaigns]
      summary: Crea una campaña con sus unidades de cultivo y parcelas (campaigns.create)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignCreate" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400":
          description: Datos incoherentes (parcela de otra finca, superficie mayor que la parcela, cultivo desconocido, fechas al revés)
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}:
    get:
      tags: [campaigns]
      summary: Ficha de una campaña (campaigns.read)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [campaigns]
      summary: Cambia los datos generales (campaigns.update)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpdate" }
      responses:
        "200":
          description: Ficha actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409":
          description: La campaña está cerrada
    delete:
      tags: [campaigns]
      summary: Borrado lógico (campaigns.delete). Una campaña cerrada no se borra.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Borrada }
        "409":
          description: La campaña está cerrada

  /campaigns/{campaignId}/upgrade:
    post:
      tags: [campaigns]
      summary: Pasa de sencilla a cuaderno completo sin copiar nada (campaigns.update)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notebookProfile: { $ref: "#/components/schemas/NotebookProfile" }
      responses:
        "200":
          description: Ficha en modo completo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409":
          description: Ya era completa, o está cerrada

  /campaigns/{campaignId}/close:
    post:
      tags: [campaigns]
      summary: Cierra la campaña y guarda la instantánea de cierre (campaigns.close)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endDate]
              properties:
                endDate: { type: string, format: date }
                declaredProductionKg: { type: number, minimum: 0 }
                closingNotes: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: >
            Campaña cerrada. La ficha lleva además `completeness` con lo que
            faltaba el día del cierre: se avisa, no se impide (ADR-0013).
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Campaign" }
                  - type: object
                    properties:
                      completeness: { $ref: "#/components/schemas/NotebookCompleteness" }
        "409":
          description: Ya estaba cerrada

  /campaigns/{campaignId}/reopen:
    post:
      tags: [campaigns]
      summary: Reabre una campaña cerrada, con motivo (campaigns.close)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        "200":
          description: Campaña activa otra vez
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409":
          description: No estaba cerrada

  /campaigns/{campaignId}/crop-units:
    post:
      tags: [campaigns]
      summary: Añade una unidad de cultivo (campaigns.update)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropUnitCreate" }
      responses:
        "201":
          description: Ficha de la campaña con la unidad nueva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }

  /campaigns/{campaignId}/crop-units/{unitId}:
    patch:
      tags: [campaigns]
      summary: Cambia una unidad; `parcels`, si viene, es la lista completa (campaigns.update)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropUnitUpdate" }
      responses:
        "200":
          description: Ficha de la campaña
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "409":
          description: Se quita una parcela con actividades registradas (el mensaje dice cuál)
    delete:
      tags: [campaigns]
      summary: Quita una unidad (borrado lógico). No la última ni una con actividades.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Quitada }
        "409":
          description: Es la última unidad, o tiene actividades registradas

  /campaigns/{campaignId}/activities:
    get:
      tags: [campaigns]
      summary: Línea de tiempo de la campaña, de lo más reciente hacia atrás (campaigns.read)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: type, in: query, schema: { type: string, enum: [irrigation, fertilization, phytosanitary, field_work, harvest, observation, sowing, other] } }
        - { name: from, in: query, description: "Actividades que tocan el intervalo", schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignActivity" }
    post:
      tags: [campaigns]
      summary: Registra lo que se ha hecho (campaigns.record)
      description: >
        Un solo alta para todos los tipos, con el detalle del tipo (`irrigation`,
        `fertilization`, `phytosanitary`, `harvest`, `fieldWork`). Nada de lo
        del cuaderno completo es obligatorio para guardar (ADR-0013); se
        rechaza lo incoherente: detalle de otro tipo, valor sin unidad,
        parcela de fuera de la campaña, fechas anteriores a la campaña o que
        todavía no han pasado.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignActivityCreate" }
      responses:
        "201":
          description: Registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignActivity" }
        "400":
          description: Incoherente (el mensaje dice qué)
        "409":
          description: La campaña está cerrada

  /campaigns/{campaignId}/activities/{activityId}:
    get:
      tags: [campaigns]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignActivity" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [campaigns]
      summary: Corrige una actividad (campaigns.record). Lo anterior queda en la auditoría.
      description: El tipo no cambia; el detalle y los destinos, si vienen, sustituyen a los anteriores enteros.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignActivityUpdate" }
      responses:
        "200":
          description: Actividad corregida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignActivity" }
        "409":
          description: La campaña está cerrada
    delete:
      tags: [campaigns]
      summary: Borrado lógico, con motivo opcional (campaigns.record)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reason, in: query, schema: { type: string, maxLength: 1000 } }
      responses:
        "204": { description: Borrada }
        "409":
          description: La campaña está cerrada

  /campaigns/{campaignId}/summary:
    get:
      tags: [campaigns]
      summary: Resumen calculado de las actividades (campaigns.read)
      description: >
        Un apartado sin actividades es `null`, no un cero. Lo que no se pudo
        calcular se cuenta aparte (`withoutVolume`, `withoutComposition`,
        `withoutKg`). El rendimiento por unidad solo cuenta las cosechas
        enteras de esa unidad.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignSummary" }

  /campaigns/{campaignId}/completeness:
    get:
      tags: [campaigns]
      summary: Qué información falta en el cuaderno completo (campaigns.read)
      description: >
        Solo aplica al modo `complete` (ADR-0013): en una campaña sencilla
        `applicable` es `false` y no hay avisos. Nunca bloquea nada y nunca
        dice que la campaña "cumple": lista lo pendiente (`missing`) y lo que
        conviene revisar (`warning`), cada uno con la fuente de su regla. El
        conjunto de reglas va versionado (`rules.id`).
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookCompleteness" }

  /crops:
    get:
      tags: [campaigns]
      summary: Catálogo de cultivos activos (campaigns.read)
      description: Entero y ordenado por nombre; es pequeño y la app filtra mientras se escribe.
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, example: aguacate }
                    name: { type: string, example: Aguacate }
                    category: { type: string, enum: [woody, herbaceous, horticultural, forage, other] }

  /notebook/people:
    get:
      tags: [campaigns]
      summary: Aplicadores y asesores guardados (campaigns.read)
      description: >
        Las de la finca pedida más las que valen para todas. Sin
        `installationId`, las de las fincas del alcance del miembro y las
        comunes.
      parameters:
        - { name: installationId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, enum: [own_staff, service_company, adviser] } }
        - { name: includeDeleted, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookPerson" }
    post:
      tags: [campaigns]
      summary: Da de alta una persona del cuaderno (campaigns.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookPersonInput" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookPerson" }
        "400":
          description: Sin nombre ni razón social

  /notebook/people/{id}:
    patch:
      tags: [campaigns]
      summary: Cambia una persona del cuaderno (campaigns.update)
      description: >
        Lo omitido se queda como está; una cadena vacía borra ese dato. Los
        tratamientos ya registrados no cambian: guardan su propia copia.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookPersonInput" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookPerson" }
    delete:
      tags: [campaigns]
      summary: Da de baja una persona del cuaderno (campaigns.update)
      description: Baja lógica; sigue pudiéndose consultar con `includeDeleted`.
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204":
          description: Dada de baja

  /notebook/equipment:
    get:
      tags: [campaigns]
      summary: Equipos de aplicación del cuaderno (campaigns.read)
      parameters:
        - { name: installationId, in: query, schema: { type: string, format: uuid } }
        - { name: includeDeleted, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NotebookEquipment" }
    post:
      tags: [campaigns]
      summary: Da de alta un equipo (campaigns.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookEquipmentInput" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookEquipment" }

  /notebook/equipment/{id}:
    patch:
      tags: [campaigns]
      summary: Cambia un equipo (campaigns.update)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotebookEquipmentInput" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotebookEquipment" }
    delete:
      tags: [campaigns]
      summary: Da de baja un equipo (campaigns.update)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204":
          description: Dado de baja

  /installations/{installationId}/latest-readings:
    get:
      tags: [readings]
      summary: Últimas lecturas de todos los canales de una instalación (dashboard)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LatestReading" }

  /zones/{zoneId}:
    get:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    patch:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneCreate" }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
    delete:
      tags: [zones]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /gateways:
    get:
      tags: [gateways]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gateway" }
    post:
      tags: [gateways]
      summary: Pre-registrar un gateway (concentrador LoRa o estación directa, ADR-0004)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayCreate" }
      responses:
        "201":
          description: >
            Creado. El campo `credentialSecret` solo aparece en esta respuesta
            (API_DESIGN.md sección 7) — no se puede recuperar después.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayCreated" }

  /gateways/{gatewayId}:
    get:
      tags: [gateways]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gateway" }
    patch:
      tags: [gateways]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                heartbeatIntervalSeconds: { type: integer, nullable: true }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gateway" }
    delete:
      tags: [gateways]
      summary: Deshabilitar gateway
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /gateways/{gatewayId}/rotate-credential:
    post:
      tags: [gateways]
      summary: Revocar la credencial activa y emitir una nueva
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: "Éxito. Igual que en la creación, el secreto solo se muestra aquí."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayCreated" }

  /gateways/{gatewayId}/latest-readings:
    get:
      tags: [readings]
      summary: Últimas lecturas de todos los canales de una Estación (pantalla "Estaciones", BACKLOG.md #30)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LatestReading" }

  /gateways/{gatewayId}/devices:
    get:
      tags: [devices]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
    post:
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }

  /devices/{deviceId}:
    get:
      tags: [devices]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
    patch:
      tags: [devices]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                zoneId: { type: string, format: uuid }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
    delete:
      tags: [devices]
      summary: Deshabilitar dispositivo
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /devices/{deviceId}/sensors:
    get:
      tags: [sensors]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sensor" }
    post:
      tags: [sensors]
      summary: Registrar un sensor (máximo 4 por dispositivo, FUNCTIONAL_REQUIREMENTS.md sección 7)
      description: >
        `_device` está reservado para los datos del propio equipo (ADR-0008): la plataforma
        lo crea sola, no cuenta para el máximo y no se puede registrar (400). Los listados
        y las rutas de un sensor tampoco lo devuelven.
      parameters:
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sensor" }

  /sensors/{sensorId}:
    get:
      tags: [sensors]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sensor" }
    delete:
      tags: [sensors]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Sin contenido }

  /sensors/{sensorId}/channels:
    get:
      tags: [channels]
      summary: Canales del sensor (creados automáticamente por ingestión, MQTT_PROTOCOL.md sección 9)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }

  /channels/{channelId}:
    patch:
      tags: [channels]
      summary: Sobrescribir el umbral de alerta de este canal (override del valor por defecto de la organización)
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertThresholdMin: { type: number, nullable: true }
                alertThresholdMax: { type: number, nullable: true }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }

  /channels/{channelId}/latest-reading:
    get:
      tags: [readings]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LatestReading" }
        "404": { $ref: "#/components/responses/NotFound" }

  /channels/{channelId}/readings:
    get:
      tags: [readings]
      summary: Histórico de lecturas (API_DESIGN.md sección 8)
      parameters:
        - $ref: "#/components/parameters/PathId"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          schema: { type: string, enum: [raw, hourly, daily], default: raw }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reading" }
        "400":
          description: "granularity=raw con un rango mayor a 7 días"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /alerts:
    get:
      tags: [alerts]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, acknowledged, resolved] }
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }

  /alerts/{alertId}/acknowledge:
    post:
      tags: [alerts]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /alerts/{alertId}/resolve:
    post:
      tags: [alerts]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200":
          description: Éxito
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit-log:
    get:
