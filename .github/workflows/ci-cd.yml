# Pipeline de referencia (Etapa 9, DEPLOYMENT.md sección 9). Etapas 13/14
# (apps/backend, apps/mobile) ya tienen código real, pero este workflow en
# sí **nunca se ha ejecutado de verdad** (el repo no tenía remoto hasta
# 2026-07-28, y hasta ahora escuchaba en `main` en vez de `master`, el
# branch real de este repo — corregido, pero sigue sin haber un run real
# que lo confirme). `mobile-ios-build.yml` sí está confirmado en vivo.

name: ci-cd

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # 1-3: Formateo, lint, análisis estático
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefix apps/backend
      - name: Formateo (prettier --check)
        run: npm run format:check --prefix apps/backend
      - name: Lint (eslint)
        run: npm run lint --prefix apps/backend
      - name: Análisis estático (tsc --noEmit)
        run: npm run typecheck --prefix apps/backend

  # 4: Pruebas unitarias
  unit-tests:
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefix apps/backend
      - run: npm run test:unit --prefix apps/backend

  # 5: Pruebas de integración (contra Postgres/Redis/EMQX de servicio)
  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iot_platform
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: iot_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefix apps/backend
      - name: Migrar esquema (como propietario de las tablas)
        run: npm run prisma:migrate --prefix apps/backend
        env:
          DATABASE_URL: postgres://iot_platform:ci_only_password@localhost:5432/iot_platform_test
      - name: Crear el rol de aplicación restringido (mismo script que docker-compose local)
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
          PGPASSWORD=ci_only_password psql -h localhost -U iot_platform -d iot_platform_test \
            -f infra/docker/postgres-init/01-app-role.sql
      - run: npm run test:integration --prefix apps/backend
        env:
          # `iot_platform_app`, NUNCA `iot_platform` (dueño de las tablas) — un
          # superusuario/dueño se salta RLS por completo, con o sin `ENABLE ROW
          # LEVEL SECURITY` (DATA_MODEL.md §7/§9, descubierto en vivo 2026-07-28).
          DATABASE_URL: postgres://iot_platform_app:dev_only_app_password@localhost:5432/iot_platform_test
          REDIS_URL: redis://localhost:6379

  # 6: Construcción
  build:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci --prefix apps/backend
      - run: npm run build --prefix apps/backend

  # 7: Escaneo de dependencias (SECURITY.md sección 10)
  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --omit=dev: las vulnerabilidades de herramientas de build (@nestjs/cli
      # -> tmp/webpack/picomatch/inquirer) nunca se ejecutan en el servicio
      # desplegado, solo durante "nest build"/generación de código en local.
      # Auditamos solo dependencias de producción para que la puerta refleje
      # riesgo real de runtime, no ruido de tooling (ver SECURITY.md §10).
      - name: npm audit (falla en crítico/alto, solo dependencias de producción)
        run: npm audit --omit=dev --audit-level=high --prefix apps/backend
      - name: Escaneo de secretos en el repositorio
        uses: gitleaks/gitleaks-action@v2

  # 8: Creación de imagen Docker
  docker-image:
    needs: dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      migrator_image_tag: ${{ steps.tag.outputs.migrator_image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          echo "image_tag=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "migrator_image_tag=ghcr.io/${{ github.repository }}:${{ github.sha }}-migrator" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}
      - name: Escaneo de la imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.image_tag }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      # `migrator` (DEPLOYMENT.md §9, infra/docker/deploy.sh) conserva el CLI
      # de `prisma` a propósito para `prisma migrate deploy` en el momento
      # del despliegue — nunca se usa para servir tráfico, así que no pasa
      # por el escaneo de Trivy de arriba (ese gatea la imagen que sí queda
      # expuesta).
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.tag.outputs.migrator_image_tag }}

  # 9: Despliegue en staging (automático al fusionar a main)
  deploy-staging:
    if: github.ref == 'refs/heads/master'
    needs: docker-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Desplegar en la VPS de staging (SSH + docker compose pull/up)
        run: echo "Deploy ${{ needs.docker-image.outputs.image_tag }} a staging (Etapa 13 añade el script real)"

  # 10: Pruebas end-to-end contra staging
  e2e-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Ejecutar suite E2E contra https://staging-api.example.com (Etapa 11)"

  # 11-12: Aprobación de producción (revisor obligatorio vía protección del environment) + despliegue
  deploy-production:
    needs: e2e-staging
    runs-on: ubuntu-latest
    environment: production # Revisores obligatorios configurados en GitHub (DEPLOYMENT.md sección 9)
    steps:
      - name: Desplegar en producción (una réplica de api cada vez, DEPLOYMENT.md sección 8)
        run: echo "Deploy ${{ needs.docker-image.outputs.image_tag }} a producción (Etapa 13 añade el script real)"

  # 13: Verificación posterior
  post-deploy-check:
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test (/health + endpoint autenticado de bajo riesgo)
        id: smoke
        run: echo "curl a /health y verificación de métricas OTel (Etapa 10)"

  # 14: Rollback automático si falla la verificación posterior
  rollback:
    needs: post-deploy-check
    if: failure()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Volver a desplegar la imagen anterior
        run: echo "Rollback a la etiqueta previa (DEPLOYMENT.md sección 8)"
