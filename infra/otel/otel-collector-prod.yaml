# Collector para staging/producción (Etapa 10, OBSERVABILITY.md sección 2) —
# equivalente a infra/otel/otel-collector-dev.yaml, pero reenvía a Grafana
# Cloud vía OTLP en vez de a consola. Ningún proceso de aplicación conoce la
# clave de Grafana Cloud directamente — solo este collector (OBSERVABILITY.md
# sección 2).
#
# Variables de entorno esperadas (inyectadas por el pipeline de despliegue
# desde GitHub Actions Environments, DEPLOYMENT.md sección 4 — nunca en este
# archivo ni versionadas):
#   GRAFANA_CLOUD_OTLP_ENDPOINT — p. ej. https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
#   GRAFANA_CLOUD_OTLP_AUTH     — cabecera "Basic" ya codificada en base64
#                                 (echo -n "<instance-id>:<api-token>" | base64),
#                                 nunca el instance-id/token en claro por separado.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:GRAFANA_CLOUD_OTLP_AUTH}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana_cloud]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana_cloud]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana_cloud]
