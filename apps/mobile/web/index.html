<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- La app va incrustada en #app, así que el viewport lo pone esta página y no Flutter. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Estaciones, sensores y alertas de tus fincas.">
  <meta name="theme-color" content="#1F6F5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plataforma IoT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plataforma IoT</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pantalla de carga (BACKLOG.md #50): en un móvil la app tarda unos segundos
    en descargar y arrancar su motor de dibujo, y hasta ahora la página se
    quedaba en blanco todo ese rato. Solo HTML y CSS, para que aparezca al
    instante; se quita con el primer fotograma de Flutter. Colores de
    lib/core/theme/app_colors.dart.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #F7F8F5; }
    body { position: relative; }
    /* Contenedor de la app (BACKLOG.md #52), del tamaño de la página; Flutter lo
       mide con un ResizeObserver. Absoluto y no fijo: en Chrome de iOS, tras
       recargar, el navegador dibujaba lo fijo unos 113 px más arriba de donde lo
       medía la propia página (que daba todo en 0 y a su alto), con un hueco
       debajo y los toques cayendo 113 px más abajo de lo que se veía. */
    #app { position: absolute; inset: 0; }
    #carga {
      position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #4A5650; font-size: 15px; transition: opacity 0.2s ease;
    }
    #carga .anillo {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #DCE3DD; border-top-color: #1F6F5C;
      animation: girar 0.9s linear infinite;
    }
    #carga.oculta { opacity: 0; }
    #carga-texto { max-width: 320px; text-align: center; padding: 0 20px; }
    #carga-detalle { max-width: 90vw; font-size: 11px; color: #4A5650; word-break: break-word; text-align: center; padding: 0 16px; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) and (min-width: 600px) {
      /* En el móvil la app arranca en claro (tema automático); en pantallas
         grandes sigue al sistema, así que la carga también. */
      html, body { background: #101513; }
      #carga { color: #AAB6B0; }
      #carga .anillo { border-color: #24302B; border-top-color: #3CA98C; }
    }
    @media (prefers-reduced-motion: reduce) {
      #carga .anillo { animation-duration: 2.5s; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="carga" role="status" aria-live="polite">
    <div class="anillo" aria-hidden="true"></div>
    <div id="carga-texto">Cargando la plataforma…</div>
    <div id="carga-detalle"></div>
  </div>
  <script>
    // Fases y fallos del arranque, antes de que Flutter pinte nada. Lo usa
    // flutter_bootstrap.js; los errores de JavaScript sueltos también llegan
    // aquí mientras no haya primer fotograma.
    (function () {
      var arrancada = false;
      var fallida = false;
      // La app no usa el scroll de la página, así que al recargar no hay
      // posición que restaurar (BACKLOG.md #52).
      try { history.scrollRestoration = 'manual'; } catch (e) {}

      // Diagnóstico de posición en el móvil, con ?diag=1 en el enlace (y ?diag=0
      // lo quita) (BACKLOG.md #52). Sigue activo en la pestaña al navegar por la
      // app y al recargar, que cambian la URL. Ver más abajo el recuadro.
      var conDiag = /[?&]diag=1/.test(window.location.search);
      try {
        if (conDiag) sessionStorage.setItem('diag', '1');
        else if (/[?&]diag=0/.test(window.location.search)) sessionStorage.removeItem('diag');
        else conDiag = sessionStorage.getItem('diag') === '1';
      } catch (e) {}
      // Últimos sucesos que mueven o miden la página, con segundos desde la carga.
      var inicio = Date.now();
      var sucesos = [];
      function anotar(que) {
        if (!conDiag) return;
        var vv = window.visualViewport;
        sucesos.push(((Date.now() - inicio) / 1000).toFixed(1) + ' ' + que +
          ' y' + Math.round(window.scrollY) +
          (vv ? ' off' + Math.round(vv.offsetTop) + ' h' + Math.round(vv.height) : '') +
          ' ch' + document.documentElement.clientHeight);
        if (sucesos.length > 8) sucesos.shift();
      }

      // Chrome para iOS (BACKLOG.md #52): si con la página ya abierta se vuelve a
      // pulsar «Ir» en la barra de direcciones, la página nueva queda dibujada
      // debajo de las barras de Chrome y eso no se puede deshacer desde ella;
      // la primera entrada, en cambio, carga bien. Así que, si en esta pestaña ya
      // se había cargado la plataforma, se vuelve a entrar una vez más, sola,
      // antes de arrancar la app y cuando Chrome ya ha cerrado su barra. La marca
      // con la hora evita repetirlo en la carga que sale de aquí.
      var recargaLimpia = false;
      var trasRecargaLimpia = false;
      try {
        var yaVista = sessionStorage.getItem('vista') === '1';
        var propia = Number(sessionStorage.getItem('recargaLimpia') || 0);
        sessionStorage.setItem('vista', '1');
        sessionStorage.removeItem('recargaLimpia');
        trasRecargaLimpia = Date.now() - propia < 30000;
        recargaLimpia = navigator.userAgent.indexOf('CriOS/') !== -1 && yaVista && !trasRecargaLimpia;
      } catch (e) {}
      if (trasRecargaLimpia) anotar('tras recarga limpia');

      function texto(t) {
        var el = document.getElementById('carga-texto');
        if (el) el.textContent = t;
      }
      window.__carga = {
        fase: function (t) {
          if (!arrancada && !fallida) texto(t);
        },
        fallo: function (donde, error) {
          if (arrancada) return;
          fallida = true;
          var anillo = document.querySelector('#carga .anillo');
          if (anillo) anillo.remove();
          texto('No se ha podido abrir la plataforma. Recarga la página; si vuelve a pasar, envía una captura de esta pantalla.');
          var detalle = document.getElementById('carga-detalle');
          if (detalle) {
            var mensaje = error && (error.stack || error.message) ? (error.message || '') + ' ' + (error.stack || '') : String(error);
            detalle.textContent = donde + ': ' + mensaje.slice(0, 600) + ' (' + navigator.userAgent + ')';
          }
        },
      };
      if (recargaLimpia) {
        window.__carga.enEspera = true;
        setTimeout(function () {
          try { sessionStorage.setItem('recargaLimpia', String(Date.now())); } catch (e) {}
          // reload y no replace con la misma dirección: con las rutas tras «#»
          // eso es un salto dentro de la página y no vuelve a cargar nada.
          location.reload();
        }, 700);
      }
      window.addEventListener('error', function (e) {
        window.__carga.fallo('error de JavaScript', e.error || (e.message + ' ' + (e.filename || '') + ':' + (e.lineno || '')));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__carga.fallo('promesa rechazada', e.reason);
      });
      setTimeout(function () {
        if (!arrancada && !fallida) texto('Está tardando más de lo normal. Si la conexión es lenta, espera un poco más.');
      }, 25000);

      // Si la zona visible no coincide con la página (desplazada tras cerrar el
      // teclado, o de otro alto), #app se coloca a mano encima de ella, en
      // coordenadas de la página (#app es absoluto, ver el estilo). Mientras se
      // escribe se deja al navegador, que desplaza la página para enseñar el campo.
      var ultimoAjuste = '';
      function escribiendo() {
        var activo = document.activeElement;
        return !!activo && /^(INPUT|TEXTAREA)$/.test(activo.tagName);
      }
      function ajustar() {
        var vv = window.visualViewport;
        var app = document.getElementById('app');
        if (!vv || !app || escribiendo()) return;
        if (Math.abs(vv.scale - 1) > 0.01) return;
        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
          setTimeout(ajustar, 50);
          return;
        }
        var arriba = Math.round(vv.pageTop);
        var alto = Math.round(vv.height);
        var cuadra = arriba === 0 && Math.abs(alto - document.documentElement.clientHeight) <= 1;
        var clave = cuadra ? '' : arriba + ',' + alto;
        if (clave === ultimoAjuste) return;
        ultimoAjuste = clave;
        anotar('ajuste ' + (clave || 'quitado'));
        app.style.top = cuadra ? '' : arriba + 'px';
        app.style.bottom = cuadra ? '' : 'auto';
        app.style.height = cuadra ? '' : alto + 'px';
      }
      function ajustarLuego(ms) { return function () { setTimeout(ajustar, ms); }; }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { anotar('vv resize'); setTimeout(ajustar, 50); });
        window.visualViewport.addEventListener('scroll', function () { anotar('vv scroll'); setTimeout(ajustar, 50); });
      }
      window.addEventListener('resize', function () { anotar('resize'); setTimeout(ajustar, 50); });
      window.addEventListener('scroll', function () { anotar('scroll'); });
      window.addEventListener('focusout', ajustarLuego(300));
      window.addEventListener('orientationchange', ajustarLuego(300));
      window.addEventListener('pageshow', function () { anotar('pageshow'); setTimeout(ajustar, 0); });
      window.addEventListener('load', function () { anotar('load'); });
      document.addEventListener('visibilitychange', function () { anotar('visible ' + document.visibilityState); });
      window.addEventListener('flutter-first-frame', function () { anotar('primer fotograma'); setTimeout(ajustar, 0); });
      // Por si iOS cambia la zona visible sin avisar. Solo lee medidas y no
      // toca nada si no han cambiado.
      setInterval(ajustar, 1000);

      // Recuadro del diagnóstico: medidas de cada capa, los últimos sucesos y
      // botones para probar a mano con la app ya desplazada. El recuadro es fijo
      // a propósito (#app no), para comparar en una captura las dos formas de
      // colocar; un punto rojo marca dónde llega cada toque, en coordenadas de
      // la página. Solo los botones reciben toques.
      if (conDiag) {
        var diag = document.createElement('div');
        diag.style.cssText = 'position:fixed;left:4px;right:4px;top:30%;z-index:9999;pointer-events:none;' +
          'background:rgba(0,0,0,.8);color:#fff;font:10px/1.35 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:6px';
        var medidas = document.createElement('div');
        medidas.style.whiteSpace = 'pre';
        diag.appendChild(medidas);
        var botones = document.createElement('div');
        botones.style.cssText = 'display:flex;gap:6px;margin-top:6px;pointer-events:auto';
        var boton = function (etiqueta, accion) {
          var b = document.createElement('button');
          b.textContent = etiqueta;
          b.style.cssText = 'flex:1;min-height:40px;font:600 13px system-ui,sans-serif;border:0;border-radius:6px;background:#fff;color:#000';
          b.addEventListener('click', function (e) { e.stopPropagation(); accion(b); });
          botones.appendChild(b);
        };
        boton('App fija', function (b) {
          var app = document.getElementById('app');
          var fija = app.style.position === 'fixed';
          app.style.position = fija ? '' : 'fixed';
          b.textContent = fija ? 'App fija' : 'App absoluta';
          anotar('app ' + (fija ? 'absoluta' : 'fija'));
        });
        boton('Empujar', function () {
          anotar('empujón');
          document.body.style.height = 'calc(100% + 80px)';
          window.scrollTo(0, 80);
          requestAnimationFrame(function () { window.scrollTo(0, 0); document.body.style.height = ''; });
        });
        boton('Recargar', function () { location.reload(); });
        diag.appendChild(botones);
        var punto = document.createElement('div');
        punto.style.cssText = 'position:absolute;z-index:9998;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#e00;pointer-events:none;display:none';
        var ultimoToque = '-';
        window.addEventListener('pointerdown', function (e) {
          punto.style.left = (e.clientX + window.scrollX) + 'px';
          punto.style.top = (e.clientY + window.scrollY) + 'px';
          punto.style.display = 'block';
          ultimoToque = Math.round(e.clientX) + ',' + Math.round(e.clientY);
        }, true);
        // Sondas invisibles con las tres alturas de viewport de CSS; fijas, para
        // que la más alta no haga desplazable la página.
        var sondas = ['svh', 'dvh', 'lvh'].map(function (u) {
          var s = document.createElement('div');
          s.style.cssText = 'position:fixed;left:-10px;top:0;width:1px;visibility:hidden;height:100' + u;
          return s;
        });
        document.addEventListener('DOMContentLoaded', function () {
          document.body.appendChild(diag);
          document.body.appendChild(punto);
          sondas.forEach(function (s) { document.body.appendChild(s); });
        });
        var caja = function (el) {
          if (!el) return '-';
          var r = el.getBoundingClientRect();
          return 'y ' + Math.round(r.top) + ' h ' + Math.round(r.height);
        };
        var maxOff = 0;
        var maxScroll = 0;
        var tipoCarga = '-';
        try {
          var nav = performance.getEntriesByType('navigation')[0];
          if (nav) tipoCarga = nav.type;
        } catch (e) {}
        setInterval(function () {
          var vv = window.visualViewport;
          var app = document.getElementById('app');
          if (vv) maxOff = Math.max(maxOff, Math.abs(vv.offsetTop));
          maxScroll = Math.max(maxScroll, Math.abs(window.scrollY));
          medidas.textContent =
            'ventana ' + window.innerWidth + 'x' + window.innerHeight + ' pant ' + screen.width + 'x' + screen.height + ' ext ' + window.outerHeight + '\n' +
            'visible ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + ' off ' + Math.round(vv.offsetTop) + ' page ' + Math.round(vv.pageTop) : '-') + '\n' +
            'scrollY ' + Math.round(window.scrollY) + ' max off ' + Math.round(maxOff) + ' scroll ' + Math.round(maxScroll) + '\n' +
            'html ' + document.documentElement.clientHeight + ' ' + caja(document.documentElement) + '  vh s/d/l ' + sondas.map(function (s) { return Math.round(s.getBoundingClientRect().height); }).join('/') + '\n' +
            '#app ' + (app ? getComputedStyle(app).position : '-') + ' ' + caja(app) + '  flutter ' + caja(document.querySelector('flutter-view')) + '\n' +
            'carga ' + tipoCarga + ' ajuste ' + (ultimoAjuste || 'no') + ' toque ' + ultimoToque + '\n' +
            '--\n' + sucesos.join('\n');
        }, 500);
      }

      window.addEventListener('flutter-first-frame', function () {
        arrancada = true;
        var carga = document.getElementById('carga');
        if (!carga) return;
        carga.classList.add('oculta');
        setTimeout(function () { carga.remove(); }, 250);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
