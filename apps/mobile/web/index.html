<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- La app va incrustada en #app, así que el viewport lo pone esta página y no Flutter. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Estaciones, sensores y alertas de tus fincas.">
  <meta name="theme-color" content="#1F6F5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plataforma IoT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plataforma IoT</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pantalla de carga (BACKLOG.md #50): en un móvil la app tarda unos segundos
    en descargar y arrancar su motor de dibujo, y hasta ahora la página se
    quedaba en blanco todo ese rato. Solo HTML y CSS, para que aparezca al
    instante; se quita con el primer fotograma de Flutter. Colores de
    lib/core/theme/app_colors.dart.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #F7F8F5; }
    /* Contenedor de la app (BACKLOG.md #52): fijo a los bordes de la zona visible.
       Flutter lo mide con un ResizeObserver y se redimensiona cuando el navegador
       del móvil muestra u oculta sus barras. */
    #app { position: fixed; inset: 0; }
    #carga {
      position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #4A5650; font-size: 15px; transition: opacity 0.2s ease;
    }
    #carga .anillo {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #DCE3DD; border-top-color: #1F6F5C;
      animation: girar 0.9s linear infinite;
    }
    #carga.oculta { opacity: 0; }
    #carga-texto { max-width: 320px; text-align: center; padding: 0 20px; }
    #carga-detalle { max-width: 90vw; font-size: 11px; color: #4A5650; word-break: break-word; text-align: center; padding: 0 16px; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) and (min-width: 600px) {
      /* En el móvil la app arranca en claro (tema automático); en pantallas
         grandes sigue al sistema, así que la carga también. */
      html, body { background: #101513; }
      #carga { color: #AAB6B0; }
      #carga .anillo { border-color: #24302B; border-top-color: #3CA98C; }
    }
    @media (prefers-reduced-motion: reduce) {
      #carga .anillo { animation-duration: 2.5s; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="carga" role="status" aria-live="polite">
    <div class="anillo" aria-hidden="true"></div>
    <div id="carga-texto">Cargando la plataforma…</div>
    <div id="carga-detalle"></div>
  </div>
  <script>
    // Fases y fallos del arranque, antes de que Flutter pinte nada. Lo usa
    // flutter_bootstrap.js; los errores de JavaScript sueltos también llegan
    // aquí mientras no haya primer fotograma.
    (function () {
      var arrancada = false;
      var fallida = false;
      function texto(t) {
        var el = document.getElementById('carga-texto');
        if (el) el.textContent = t;
      }
      window.__carga = {
        fase: function (t) {
          if (!arrancada && !fallida) texto(t);
        },
        fallo: function (donde, error) {
          if (arrancada) return;
          fallida = true;
          var anillo = document.querySelector('#carga .anillo');
          if (anillo) anillo.remove();
          texto('No se ha podido abrir la plataforma. Recarga la página; si vuelve a pasar, envía una captura de esta pantalla.');
          var detalle = document.getElementById('carga-detalle');
          if (detalle) {
            var mensaje = error && (error.stack || error.message) ? (error.message || '') + ' ' + (error.stack || '') : String(error);
            detalle.textContent = donde + ': ' + mensaje.slice(0, 600) + ' (' + navigator.userAgent + ')';
          }
        },
      };
      window.addEventListener('error', function (e) {
        window.__carga.fallo('error de JavaScript', e.error || (e.message + ' ' + (e.filename || '') + ':' + (e.lineno || '')));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__carga.fallo('promesa rechazada', e.reason);
      });
      setTimeout(function () {
        if (!arrancada && !fallida) texto('Está tardando más de lo normal. Si la conexión es lenta, espera un poco más.');
      }, 25000);
      // iOS (Safari y Chrome) puede dejar la zona visible desplazada hacia
      // arriba tras cerrar el teclado: la app se ve cortada por arriba y con
      // un hueco debajo de la barra inferior. Si no se está escribiendo en
      // ningún campo, se devuelve la página a su sitio.
      function recolocar() {
        var activo = document.activeElement;
        var escribiendo = activo && /^(INPUT|TEXTAREA)$/.test(activo.tagName);
        var vv = window.visualViewport;
        var desplazada = window.scrollY !== 0 || (vv && vv.offsetTop !== 0);
        if (!escribiendo && desplazada) window.scrollTo(0, 0);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { setTimeout(recolocar, 50); });
        window.visualViewport.addEventListener('scroll', function () { setTimeout(recolocar, 50); });
      }
      window.addEventListener('focusout', function () { setTimeout(recolocar, 300); });
      window.addEventListener('orientationchange', function () { setTimeout(recolocar, 300); });

      window.addEventListener('flutter-first-frame', function () {
        arrancada = true;
        var carga = document.getElementById('carga');
        if (!carga) return;
        carga.classList.add('oculta');
        setTimeout(function () { carga.remove(); }, 250);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
