<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- La app va incrustada en #app, así que el viewport lo pone esta página y no Flutter. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Estaciones, sensores y alertas de tus fincas.">
  <meta name="theme-color" content="#1F6F5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Plataforma IoT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plataforma IoT</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Pantalla de carga (BACKLOG.md #50): en un móvil la app tarda unos segundos
    en descargar y arrancar su motor de dibujo, y hasta ahora la página se
    quedaba en blanco todo ese rato. Solo HTML y CSS, para que aparezca al
    instante; se quita con el primer fotograma de Flutter. Colores de
    lib/core/theme/app_colors.dart.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #F7F8F5; }
    /* Contenedor de la app (BACKLOG.md #52): fijo a los bordes de la zona visible.
       Flutter lo mide con un ResizeObserver y se redimensiona cuando el navegador
       del móvil muestra u oculta sus barras. */
    #app { position: fixed; inset: 0; }
    #carga {
      position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #4A5650; font-size: 15px; transition: opacity 0.2s ease;
    }
    #carga .anillo {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #DCE3DD; border-top-color: #1F6F5C;
      animation: girar 0.9s linear infinite;
    }
    #carga.oculta { opacity: 0; }
    #carga-texto { max-width: 320px; text-align: center; padding: 0 20px; }
    #carga-detalle { max-width: 90vw; font-size: 11px; color: #4A5650; word-break: break-word; text-align: center; padding: 0 16px; }
    @keyframes girar { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) and (min-width: 600px) {
      /* En el móvil la app arranca en claro (tema automático); en pantallas
         grandes sigue al sistema, así que la carga también. */
      html, body { background: #101513; }
      #carga { color: #AAB6B0; }
      #carga .anillo { border-color: #24302B; border-top-color: #3CA98C; }
    }
    @media (prefers-reduced-motion: reduce) {
      #carga .anillo { animation-duration: 2.5s; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="carga" role="status" aria-live="polite">
    <div class="anillo" aria-hidden="true"></div>
    <div id="carga-texto">Cargando la plataforma…</div>
    <div id="carga-detalle"></div>
  </div>
  <script>
    // Fases y fallos del arranque, antes de que Flutter pinte nada. Lo usa
    // flutter_bootstrap.js; los errores de JavaScript sueltos también llegan
    // aquí mientras no haya primer fotograma.
    (function () {
      var arrancada = false;
      var fallida = false;
      function texto(t) {
        var el = document.getElementById('carga-texto');
        if (el) el.textContent = t;
      }
      window.__carga = {
        fase: function (t) {
          if (!arrancada && !fallida) texto(t);
        },
        fallo: function (donde, error) {
          if (arrancada) return;
          fallida = true;
          var anillo = document.querySelector('#carga .anillo');
          if (anillo) anillo.remove();
          texto('No se ha podido abrir la plataforma. Recarga la página; si vuelve a pasar, envía una captura de esta pantalla.');
          var detalle = document.getElementById('carga-detalle');
          if (detalle) {
            var mensaje = error && (error.stack || error.message) ? (error.message || '') + ' ' + (error.stack || '') : String(error);
            detalle.textContent = donde + ': ' + mensaje.slice(0, 600) + ' (' + navigator.userAgent + ')';
          }
        },
      };
      window.addEventListener('error', function (e) {
        window.__carga.fallo('error de JavaScript', e.error || (e.message + ' ' + (e.filename || '') + ':' + (e.lineno || '')));
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__carga.fallo('promesa rechazada', e.reason);
      });
      setTimeout(function () {
        if (!arrancada && !fallida) texto('Está tardando más de lo normal. Si la conexión es lenta, espera un poco más.');
      }, 25000);
      // iOS (Safari y Chrome) puede dejar la zona visible desplazada o más alta
      // que la página que mide (BACKLOG.md #52): tras cerrar el teclado, o al
      // recargar pulsando «Ir» en la barra de direcciones con el teclado aún
      // abierto. La app se veía cortada por arriba y con un hueco debajo de la
      // barra inferior. Con `inset: 0` no basta, porque el navegador coloca lo
      // fijo respecto a esa medida corta; así que, si no coinciden, #app se
      // coloca a mano sobre la zona visible que da `visualViewport`. Mientras se
      // escribe se deja al navegador (desplaza la página para enseñar el campo).
      var ultimoAjuste = '';
      function ajustar() {
        var vv = window.visualViewport;
        var app = document.getElementById('app');
        if (!vv || !app) return;
        var activo = document.activeElement;
        if (activo && /^(INPUT|TEXTAREA)$/.test(activo.tagName)) return;
        if (Math.abs(vv.scale - 1) > 0.01) return;
        if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
        var arriba = Math.round(vv.offsetTop);
        var alto = Math.round(vv.height);
        var cuadra = arriba === 0 && Math.abs(alto - document.documentElement.clientHeight) <= 1;
        var clave = cuadra ? '' : arriba + ',' + alto;
        if (clave === ultimoAjuste) return;
        ultimoAjuste = clave;
        app.style.top = cuadra ? '' : arriba + 'px';
        app.style.bottom = cuadra ? '' : 'auto';
        app.style.height = cuadra ? '' : alto + 'px';
      }
      function ajustarLuego(ms) { return function () { setTimeout(ajustar, ms); }; }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', ajustarLuego(50));
        window.visualViewport.addEventListener('scroll', ajustarLuego(50));
      }
      window.addEventListener('resize', ajustarLuego(50));
      window.addEventListener('focusout', ajustarLuego(300));
      window.addEventListener('orientationchange', ajustarLuego(300));
      window.addEventListener('pageshow', ajustarLuego(0));
      window.addEventListener('flutter-first-frame', ajustarLuego(0));
      // Por si iOS cambia la zona visible sin avisar (al terminar de esconder el
      // teclado tras la recarga no siempre llega el evento). Solo lee medidas y
      // no toca nada si no han cambiado.
      setInterval(ajustar, 1000);

      // Diagnóstico de posición en el móvil, solo con ?diag=1 en el enlace
      // (BACKLOG.md #52): las medidas de cada capa encima de la app, para ver en
      // una captura cuál se desplaza. No recibe toques.
      if (/[?&]diag=1/.test(window.location.search)) {
        var diag = document.createElement('div');
        diag.style.cssText = 'position:fixed;left:4px;top:50%;z-index:9999;pointer-events:none;' +
          'background:rgba(0,0,0,.75);color:#fff;font:11px/1.35 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:6px;white-space:pre';
        // Sondas invisibles con las tres alturas de viewport de CSS.
        var sondas = ['svh', 'dvh', 'lvh'].map(function (u) {
          var s = document.createElement('div');
          s.style.cssText = 'position:absolute;left:-10px;top:0;width:1px;visibility:hidden;height:100' + u;
          return s;
        });
        document.addEventListener('DOMContentLoaded', function () {
          document.body.appendChild(diag);
          sondas.forEach(function (s) { document.body.appendChild(s); });
        });
        var caja = function (el) {
          if (!el) return '-';
          var r = el.getBoundingClientRect();
          return 'y ' + Math.round(r.top) + ' h ' + Math.round(r.height);
        };
        var maxOff = 0;
        var maxScroll = 0;
        setInterval(function () {
          var vv = window.visualViewport;
          if (vv) maxOff = Math.max(maxOff, Math.abs(vv.offsetTop));
          maxScroll = Math.max(maxScroll, Math.abs(window.scrollY));
          diag.textContent =
            'ventana   ' + window.innerWidth + 'x' + window.innerHeight + ' pant ' + screen.height + '\n' +
            'visible   ' + (vv ? Math.round(vv.width) + 'x' + Math.round(vv.height) + ' off ' + Math.round(vv.offsetTop) : '-') + '\n' +
            'scrollY   ' + Math.round(window.scrollY) + ' body ' + document.body.scrollTop + '\n' +
            'max       off ' + Math.round(maxOff) + ' scroll ' + Math.round(maxScroll) + '\n' +
            'html      ' + document.documentElement.clientHeight + ' ' + caja(document.documentElement) + '\n' +
            'vh s/d/l  ' + sondas.map(function (s) { return Math.round(s.getBoundingClientRect().height); }).join('/') + '\n' +
            '#app      ' + caja(document.getElementById('app')) + '\n' +
            'flutter   ' + caja(document.querySelector('flutter-view')) + '\n' +
            'foco      ' + (document.activeElement ? document.activeElement.tagName : '-');
        }, 500);
      }

      window.addEventListener('flutter-first-frame', function () {
        arrancada = true;
        var carga = document.getElementById('carga');
        if (!carga) return;
        carga.classList.add('oculta');
        setTimeout(function () { carga.remove(); }, 250);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
