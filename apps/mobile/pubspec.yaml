name: iot_platform_app
description: >
  App Flutter (web, Android, iOS) de la plataforma de monitorización IoT.
  ARCHITECTURE.md / API_DESIGN.md son el contrato contra el que habla esta app.
publish_to: "none"
version: 0.1.0

# Minimos subidos al añadir flutter_map 8 (satelite, BACKLOG.md #36), que pide
# Dart 3.6 y Flutter 3.27. La herramienta real de este proyecto y la del CI ya
# son 3.44.8, asi que no cambia nada en la practica.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Traducciones de los widgets de Material (selector de fecha en español).
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  # Mapa del modulo de satelite (ADR-0011). Dart puro, sin plugin nativo: el
  # mismo codigo en web, iOS y Android.
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  google_fonts: ^8.2.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# `jni` 1.0.1 (dependencia transitiva de flutter_secure_storage ->
# path_provider_android) fue retirado por sus autores en pub.dev: su
# build.gradle solo aplica el plugin de Kotlin si AGP < 9, y este proyecto
# (generado por `flutter create` en 2026) usa AGP 9.0.1 — sin el override,
# `flutter build apk` falla con "Could not find method kotlin()". 1.0.2 lo
# corrige.
dependency_overrides:
  jni: ^1.0.2

flutter:
  uses-material-design: true
