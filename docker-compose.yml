# Entorno de desarrollo local (Etapa 9, DEPLOYMENT.md sección 5).
# api/ingestion/worker ya usan el código real de apps/backend (Etapa 13).
# Requiere apps/backend/.env.development (copiar de .env.example, nunca
# commitear — SECURITY.md §7) con al menos el par de claves JWT de desarrollo.
#
# Migraciones (`prisma migrate deploy`) y el seed corren como `iot_platform`
# (dueño de las tablas, necesario para DDL) — usa esa URL explícitamente,
# no la de `api`/`ingestion`/`worker`, que se conectan como `iot_platform_app`
# (infra/docker/postgres-init/01-app-role.sql) para que RLS tenga efecto.

services:
  postgres:
    # PostGIS, no `postgres:16-alpine` a secas: la migración 0008 (parcelas,
    # BACKLOG.md #36) crea la extensión y una columna `geometry`. La base
    # gestionada de staging (DigitalOcean) trae PostGIS 3.5.7 disponible, así
    # que en local se usa la misma línea 3.5 para que lo que pasa aquí valga
    # allí. La imagen es la oficial de Postgres con la extensión añadida:
    # mismo entrypoint y mismo `docker-entrypoint-initdb.d`.
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: iot_platform
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: iot_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea `iot_platform_app` (rol de aplicación, sin BYPASSRLS/superusuario)
      # la primera vez que se inicializa el volumen — ver el propio script
      # para el porqué: sin él, RLS queda sin efecto (DATA_MODEL.md §7).
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.4
    environment:
      EMQX_NAME: iot-platform-dev
    ports:
      - "1883:1883"   # MQTT (sin TLS, solo desarrollo local)
      - "8883:8883"   # MQTTS
      - "18083:18083" # Dashboard de administración
    volumes:
      - emqx_data:/opt/emqx/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev_access_key
      MINIO_ROOT_PASSWORD: dev_secret_key
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP falso (worker envía aquí en desarrollo)
      - "8025:8025" # Interfaz web para ver los emails capturados

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./infra/otel/otel-collector-dev.yaml:/etc/otelcol/config.yaml
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    env_file: [apps/backend/.env.development]
    environment:
      PROCESS_ROLE: api
      NODE_ENV: development
      DATABASE_URL: postgres://iot_platform_app:dev_only_app_password@postgres:5432/iot_platform
      REDIS_URL: redis://redis:6379
      # `.env.development` fija SMTP_HOST=localhost (correcto solo si se
      # ejecuta el backend directamente en el host) — `api` (a diferencia de
      # `worker`, que ya lo sobreescribía) no lo corregía, así que las
      # invitaciones enviadas directamente por `PlatformOrganizationsService`
      # (no solo las que pasan por `worker`) fallaban con ECONNREFUSED contra
      # 127.0.0.1:1025 dentro del contenedor. Encontrado en vivo verificando
      # la pantalla "Estaciones" (BACKLOG.md #30).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "3000:3000"
    depends_on: [postgres, redis, otel-collector]

  ingestion:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    env_file: [apps/backend/.env.development]
    environment:
      PROCESS_ROLE: ingestion
      NODE_ENV: development
      # A diferencia de `api`/`worker`, a este servicio le faltaba el
      # `DATABASE_URL` de red del contenedor — sin él caía al valor de
      # `.env.development` (`localhost:5432`, correcto solo si se ejecuta
      # el backend directamente en el host), y el proceso no llegaba ni a
      # arrancar (`PrismaClientInitializationError`, crash-loop). Encontrado
      # en vivo verificando la ingesta real de un dato MQTT para la pantalla
      # "Estaciones" (BACKLOG.md #30).
      DATABASE_URL: postgres://iot_platform_app:dev_only_app_password@postgres:5432/iot_platform
      MQTT_BROKER_URL: mqtt://emqx:1883
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on: [postgres, emqx, redis, otel-collector]

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: runtime
    env_file: [apps/backend/.env.development]
    environment:
      PROCESS_ROLE: worker
      NODE_ENV: development
      DATABASE_URL: postgres://iot_platform_app:dev_only_app_password@postgres:5432/iot_platform
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on: [postgres, redis, mailpit, otel-collector]

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  minio_data:
